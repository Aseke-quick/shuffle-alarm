# Every push: format check, `flutter analyze` and `flutter test`.
# Every push to main: also build the web app and deploy it to GitHub Pages.
# Why the versions are pinned like this: docs/DECISIONS.md (task 0.4).
name: CI

on:
  push:
  # Also lets you rerun the checks, and redeploy main, from the Actions tab.
  workflow_dispatch:

# Read-only by default; the deploy job asks for more below.
permissions:
  contents: read

# A newer push to the same branch cancels the older run. On main every run
# finishes, so a deployment never stops halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in step with the Flutter version on the Mac (docs/DECISIONS.md, 0.1).
  FLUTTER_VERSION: 3.47.8

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Fails if pubspec.lock is out of date, so CI uses the same packages.
      - name: Get packages
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  deploy:
    name: Build and deploy web app
    # Only a main branch that passed the checks goes live.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get --enforce-lockfile

      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # base_path is "/shuffle-alarm" for this repo's site, "" with a custom
      # domain, so renaming the repo does not break the site.
      - name: Build web app
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --base-href "$BASE_PATH/"

      - name: Upload web app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
