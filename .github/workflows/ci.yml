# Every push: format check, `flutter analyze` and `flutter test`.
# Every push to main: also build the web app and publish the built files to
# the `gh-pages` branch of this repo, which GitHub Pages serves (the repo is
# public since 2026-11-15, docs/DECISIONS.md).
# Why it works like this, and why the versions are pinned: docs/DECISIONS.md
# (task 0.4).
name: CI

on:
  push:
  # Also lets you rerun the checks, and redeploy main, from the Actions tab.
  workflow_dispatch:

# Read-only by default; the deploy job asks for more below.
permissions:
  contents: read

# A newer push to the same branch cancels the older run. On main every run
# finishes, so a deployment never stops halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in step with the Flutter version on the Mac (docs/DECISIONS.md, 0.1).
  FLUTTER_VERSION: 3.47.8

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Fails if pubspec.lock is out of date, so CI uses the same packages.
      - name: Get packages
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The tests of the clock changes of daylight saving time run only in a
      # time zone that has them, and CI runs in UTC (docs/DECISIONS.md, 2.2
      # and 2.2a).
      - name: Test the clock changes of daylight saving time
        run: |
          for zone in Europe/Berlin America/New_York; do
            TZ=$zone flutter test test/core/next_ring_test.dart test/core/bedtime_test.dart test/core/morning_test.dart
          done

  deploy:
    name: Build and publish web app
    # Only a main branch that passed the checks goes live.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # To push the built files to the gh-pages branch.
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get --enforce-lockfile

      # The base href is the repo's name: its site lives at
      # https://aseke-quick.github.io/shuffle-alarm/. The site serves
      # Flutter's web engine (CanvasKit) itself, not from Google's CDN.
      - name: Build web app
        run: flutter build web --release --base-href /shuffle-alarm/ --no-web-resources-cdn

      # The `gh-pages` branch gets the built files as one fresh commit each
      # time, so it never holds old builds.
      - name: Publish to the gh-pages branch
        working-directory: build/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .last_build_id
          # GitHub Pages serves the files as they are, without Jekyll.
          touch .nojekyll
          git init --quiet --initial-branch=gh-pages
          git add --all
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "Publish web build ${GITHUB_SHA::7}"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
