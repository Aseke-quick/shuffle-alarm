# Every push: format check, `flutter analyze` and `flutter test`.
# Every push to main: also build the web app and publish only the built files
# to the public repo Aseke-quick/shuffle-alarm-web, which GitHub Pages serves.
# Why it works like this, and why the versions are pinned: docs/DECISIONS.md
# (task 0.4).
name: CI

on:
  push:
  # Also lets you rerun the checks, and redeploy main, from the Actions tab.
  workflow_dispatch:

# Read-only by default; the deploy job asks for more below.
permissions:
  contents: read

# A newer push to the same branch cancels the older run. On main every run
# finishes, so a deployment never stops halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Keep in step with the Flutter version on the Mac (docs/DECISIONS.md, 0.1).
  FLUTTER_VERSION: 3.47.8

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Fails if pubspec.lock is out of date, so CI uses the same packages.
      - name: Get packages
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The tests of the clock changes of daylight saving time run only in a
      # time zone that has them, and CI runs in UTC (docs/DECISIONS.md, 2.2).
      - name: Test the clock changes of daylight saving time
        run: |
          for zone in Europe/Berlin America/New_York; do
            TZ=$zone flutter test test/core/next_ring_test.dart
          done

  deploy:
    name: Build and publish web app
    # Only a main branch that passed the checks goes live.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        run: flutter pub get --enforce-lockfile

      # The base href is the site repo's name: its site lives at
      # https://aseke-quick.github.io/shuffle-alarm-web/.
      - name: Build web app
        run: flutter build web --release --base-href /shuffle-alarm-web/

      # The site repo gets the built files as one fresh commit each time, so
      # it never holds source code or old builds. SITE_DEPLOY_TOKEN is a
      # fine-grained token with Contents read/write on the site repo only.
      - name: Publish to the public site repo
        working-directory: build/web
        env:
          SITE_REPO: Aseke-quick/shuffle-alarm-web
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SITE_DEPLOY_TOKEN" ]; then
            echo "::error::Secret SITE_DEPLOY_TOKEN is missing (docs/DECISIONS.md, 0.4)."
            exit 1
          fi
          rm -f .last_build_id
          # GitHub Pages serves the files as they are, without Jekyll.
          touch .nojekyll
          cat > README.md <<'EOF'
          # Shuffle Alarm web test version

          Built files of the Shuffle Alarm web test version, published here automatically: https://aseke-quick.github.io/shuffle-alarm-web/

          The source code is private.

          Copyright (c) 2026 Aseke-quick. All rights reserved.
          EOF
          git init --quiet --initial-branch=main
          git add --all
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message "Publish web build ${GITHUB_SHA::7}"
          git push --force --quiet \
            "https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/${SITE_REPO}.git" main
