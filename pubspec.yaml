name: shuffle_alarm
description: "Wakemix: an alarm that wakes you with a new mix every morning."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
#
# Keep each list sorted A to Z (lint rule `sort_pub_dependencies`).
dependencies:
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # The database in lib/data (see docs/DECISIONS.md, task 2.1). drift and
  # sqlite3 are pinned to exact versions: web/drift_worker.js and
  # web/sqlite3.wasm come from these two releases, so change the versions and
  # the files together (test/data/web_files_test.dart checks them).
  drift: 2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  # The texts of Flutter's own widgets, dates and times in English, Russian
  # and Kazakh (task 2.9). `material_ui` brings its translations itself.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  # Plurals and numbers of the generated texts in lib/l10n (task 2.9).
  intl: ^0.20.2
  material_ui: ^1.8.0
  # `@immutable` for the models in lib/core/models (see docs/DECISIONS.md).
  meta: ^1.18.3
  # The folder of the database file on Android, iOS and desktop.
  path_provider: ^2.1.6
  # Simple settings on the device, in lib/data (docs/DECISIONS.md, task 2.4a).
  shared_preferences: ^2.5.6
  # SQLite for drift; pinned together with drift, see above.
  sqlite3: 3.8.0
  # The browser APIs of the web version in lib/platform/web: Web Audio, the
  # screen wake lock (docs/DECISIONS.md, task 2.4) and notifications (2.4a).
  # Web only, so only lib/platform/web imports it.
  web: ^1.1.2

dev_dependencies:
  # Generates lib/data/database.g.dart: `dart run build_runner build`.
  build_runner: ^2.17.1
  # SHA-256 of the web database files in test/data/web_files_test.dart.
  crypto: ^3.0.8
  # The drift code generator that build_runner runs.
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  # A store in memory for shared_preferences, in the tests.
  shared_preferences_platform_interface: ^2.4.2
  # Strict lint rules, activated in `analysis_options.yaml`.
  very_good_analysis: ^11.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates lib/l10n/app_localizations*.dart from the .arb files there
  # (l10n.yaml): at `flutter pub get`, or with `flutter gen-l10n`.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The built-in library (task 2.3): manifest.json and a folder of clips for
  # each genre. Flutter does not take in the subfolders of a folder, so each
  # genre has its own line.
  assets:
    - assets/library/
    - assets/library/acoustic/
    - assets/library/electronic/
    - assets/library/lo-fi/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # The Wakemix font (lib/design/fonts.dart, ADR-005): Geist, a variable font
  # under the SIL Open Font License, with its OFL.txt next to it. Where the
  # file comes from: docs/DECISIONS.md, task 2.2a.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist.ttf
    # Flutter's web engine downloads Roboto from Google's font servers as
    # its last-resort font, unless the app has a font family of that name.
    # Geist takes that role, so the web app downloads no font either.
    - family: Roboto
      fonts:
        - asset: assets/fonts/geist/Geist.ttf
