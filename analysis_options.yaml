# Analyzer and lint settings. `flutter analyze` must report 0 issues.
# Why these rules, and why two of them are turned off: docs/DECISIONS.md.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Build output and native platform folders hold no app Dart code.
    - build/**
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**
    # Generated from lib/l10n/*.arb by `flutter gen-l10n`.
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    # This is an app, not a published package.
    public_member_api_docs: false
    # Keep the classic `ClassName(...)` constructor form used in Flutter docs.
    unnecessary_type_name_in_constructor: false
